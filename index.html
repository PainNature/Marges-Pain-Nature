<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boulangerie Pro - V29.1 (GitHub Sync)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #d35400; --secondary: #2c3e50; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .nav-tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; overflow-x: auto; }
        .tab-btn { padding: 10px 15px; border: none; background: #95a5a6; color: white; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); }
        .container { background: white; padding: 20px; border-radius: 0 5px 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-box { border: 1px solid #e1e1e1; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        .btn { padding: 8px 12px; border: none; cursor: pointer; color: white; border-radius: 4px; font-weight: bold; }
        .chk-grid { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 0.70em; gap: 2px; }
        .result-card { background: #34495e; color: white; padding: 10px; border-radius: 5px; text-align: center; }
        input, select { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body onload="initGitHub()">

<div class="nav-tabs">
    <button class="tab-btn active" onclick="changeTab('mp')">Matière première</button>
    <button class="tab-btn" onclick="changeTab('labo')">Labo</button>
    <button class="tab-btn" onclick="changeTab('boulange')">Boulangerie</button>
    <button class="tab-btn" onclick="changeTab('patis')">Pâtisserie</button>
    <button class="tab-btn" onclick="changeTab('viennoiseries')">Viennoiserie</button>
    <button class="tab-btn" onclick="changeTab('voyage')">Gat. Voyages</button>
    <button class="tab-btn" onclick="changeTab('historique')">Historique</button>
</div>

<div class="container">
    <!-- ONGLET MATIERE PREMIERE -->
    <div id="tab-mp" class="tab-content active">
        <div class="section-box">
            <h3>☁️ Synchronisation GitHub</h3>
            <p id="sync-status"><strong>Statut :</strong> Connexion...</p>
            <button class="btn" style="background:#2980b9" onclick="pushToGitHub()">🔄 Sauvegarder sur GitHub</button>
        </div>
        <table>
            <thead>
                <tr><th>Métiers</th><th>Fournisseur</th><th>Produit</th><th>Prix HT/KG</th><th>Action</th></tr>
            </thead>
            <tbody id="body-mp"></tbody>
        </table>
        <button class="btn" style="background:var(--success)" onclick="addRowMP()">+ Ajouter MP</button>
    </div>

    <!-- ONGLET LABO -->
    <div id="tab-labo" class="tab-content">
        <div id="capture-zone">
            <h2>🧪 Composition : <input type="text" id="recipe-name-labo" placeholder="Nom produit"></h2>
            <table>
                <thead>
                    <tr>
                        <th>Filtrer par métier</th>
                        <th>Ingrédient</th>
                        <th>Qté (g)</th>
                        <th>Prix (€/kg)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="body-recette"></tbody>
            </table>
            <button class="btn" style="background:var(--success)" onclick="addRowRecette()">+ Ingrédient</button>
            <hr>
            <div class="section-box">
                <p><strong>Total pâte crue :</strong> <span id="res-total-raw">0</span>g</p>
                <label>Poids 1 pièce crue (g) :</label><input type="number" id="input-cru" oninput="calculerFinance()">
            </div>
            <div class="section-box">
                <div class="result-card" style="background:var(--primary)">
                    <strong>Prix de vente (TTC) :</strong> <br>
                    <span id="fin-c-ttc" style="font-size:1.5em">0.00</span>€
                </div>
            </div>
        </div>

        <div class="section-box" style="background:#fef9e7; border: 1px solid #f1c40f;">
            <h3>📤 Exportation & Classement</h3>
            <button class="btn" style="background:#e67e22" onclick="exportToJPG()">📸 JPEG</button>
            <select id="export-target-onglet" style="margin: 0 10px;">
                <option value="boulange">Boulangerie</option>
                <option value="patis">Pâtisserie</option>
                <option value="viennoiseries">Viennoiserie</option>
                <option value="voyage">Gâteaux de Voyages</option>
            </select>
            <button class="btn" style="background:#8e44ad" onclick="alert('Fiche classée !')">📂 Classer la fiche</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION GITHUB ---
    const GH_TOKEN = "TON_TOKEN_ICI"; // À remplacer par ton token
    const GH_REPO = "TON_NOM_UTILISATEUR/TON_DEPOT";
    const GH_PATH = "data/ingredients.json";
    let fileSha = "";

    function changeTab(target) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + target).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- GESTION MATIERE PREMIERE ---
    function addRowMP(data = {}) {
        const row = document.getElementById('body-mp').insertRow();
        row.innerHTML = `
            <td><div class="chk-grid">
                <label><input type="checkbox" class="m-b" ${data.b?'checked':''}> B</label>
                <label><input type="checkbox" class="m-p" ${data.p?'checked':''}> P</label>
                <label><input type="checkbox" class="m-v" ${data.v?'checked':''}> V</label>
                <label><input type="checkbox" class="m-g" ${data.g?'checked':''}> G</label>
            </div></td>
            <td><input type="text" class="mp-fourn" value="${data.f || ''}"></td>
            <td><input type="text" class="mp-nom" value="${data.n || ''}"></td>
            <td><input type="number" class="mp-prix" value="${data.px || ''}"></td>
            <td><button class="btn" style="background:red" onclick="this.parentElement.parentElement.remove()">❌</button></td>
        `;
    }

    // --- GESTION LABO (FILTRAGE & SELECTION) ---
    function addRowRecette() {
        const row = document.getElementById('body-recette').insertRow();
        row.innerHTML = `
            <td>
                <select onchange="remplirSelectIngredients(this)">
                    <option value="ALL">Tous</option>
                    <option value="B">Boulangerie</option>
                    <option value="P">Pâtisserie</option>
                    <option value="V">Viennoiserie</option>
                    <option value="G">G. Voyage</option>
                </select>
            </td>
            <td><select class="rec-sel-ing" style="width:100%" onchange="updatePriceFromSelection(this)"></select></td>
            <td><input type="number" class="rec-qte" value="0" style="width:70px" oninput="calculerFinance()"></td>
            <td class="rec-u-prix">0.00</td>
            <td><button class="btn" style="background:red" onclick="this.parentElement.parentElement.remove(); calculerFinance()">❌</button></td>
        `;
        remplirSelectIngredients(row.cells[0].querySelector('select'));
    }

    function remplirSelectIngredients(selectFiltre) {
        const metier = selectFiltre.value;
        const targetSelect = selectFiltre.parentElement.parentElement.querySelector('.rec-sel-ing');
        const rowsMP = document.querySelectorAll('#body-mp tr');
        
        let options = '<option value="0">Choisir...</option>';
        rowsMP.forEach(tr => {
            const nom = tr.querySelector('.mp-nom').value;
            const prix = tr.querySelector('.mp-prix').value;
            const match = (metier === 'ALL') || 
                          (metier === 'B' && tr.querySelector('.m-b').checked) ||
                          (metier === 'P' && tr.querySelector('.m-p').checked) ||
                          (metier === 'V' && tr.querySelector('.m-v').checked) ||
                          (metier === 'G' && tr.querySelector('.m-g').checked);

            if(nom && match) {
                options += `<option value="${prix}">${nom}</option>`;
            }
        });
        targetSelect.innerHTML = options;
    }

    function updatePriceFromSelection(sel) {
        sel.parentElement.parentElement.querySelector('.rec-u-prix').innerText = sel.value;
        calculerFinance();
    }

    function calculerFinance() {
        let totalCout = 0, totalPoids = 0;
        document.querySelectorAll('#body-recette tr').forEach(tr => {
            const qte = parseFloat(tr.querySelector('.rec-qte').value) || 0;
            const prix = parseFloat(tr.querySelector('.rec-sel-ing').value) || 0;
            totalCout += (qte/1000) * prix;
            totalPoids += qte;
        });
        document.getElementById('res-total-raw').innerText = totalPoids;
        const cru = parseFloat(document.getElementById('input-cru').value) || 0;
        const ttc = (totalPoids > 0) ? (totalCout / totalPoids) * cru * 3 * 1.055 : 0;
        document.getElementById('fin-c-ttc').innerText = ttc.toFixed(2);
    }

    // --- LOGIQUE GITHUB (STORAGE CLOUD) ---
    async function initGitHub() {
        try {
            const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                headers: { "Authorization": `token ${GH_TOKEN}` }
            });
            if(res.ok) {
                const json = await res.json();
                fileSha = json.sha;
                const content = JSON.parse(atob(json.content));
                content.forEach(item => addRowMP(item));
                document.getElementById('sync-status').innerText = "Statut : Connecté à GitHub";
            }
        } catch(e) { document.getElementById('sync-status').innerText = "Statut : Erreur GitHub"; }
    }

    async function pushToGitHub() {
        const data = [];
        document.querySelectorAll('#body-mp tr').forEach(tr => {
            data.push({
                b: tr.querySelector('.m-b').checked, p: tr.querySelector('.m-p').checked,
                v: tr.querySelector('.m-v').checked, g: tr.querySelector('.m-g').checked,
                f: tr.querySelector('.mp-fourn').value, n: tr.querySelector('.mp-nom').value,
                px: tr.querySelector('.mp-prix').value
            });
        });

        const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
            method: "PUT",
            headers: { "Authorization": `token ${GH_TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                message: "Mise à jour ingrédients",
                content: btoa(JSON.stringify(data)),
                sha: fileSha
            })
        });
        if(res.ok) {
            const json = await res.json();
            fileSha = json.content.sha;
            alert("Sauvegarde GitHub réussie !");
        }
    }

    function exportToJPG() {
        html2canvas(document.querySelector("#capture-zone")).then(canvas => {
            const link = document.createElement('a');
            link.download = (document.getElementById('recipe-name-labo').value || 'recette') + '.jpg';
            link.href = canvas.toDataURL("image/jpeg");
            link.click();
        });
    }
</script>
</body>
</html>
