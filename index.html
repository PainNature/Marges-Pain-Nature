<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boulangerie Pro - V30.9 (Sécurité Cloud)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #d35400; --secondary: #2c3e50; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 3px solid var(--secondary); overflow-x: auto; }
        .tab-btn { padding: 12px 20px; border: none; background: #bdc3c7; color: white; cursor: pointer; font-weight: bold; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: var(--primary); }
        .container { background: white; padding: 25px; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .result-card { background: var(--secondary); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: left; }
        .btn { padding: 10px 15px; border: none; cursor: pointer; color: white; border-radius: 4px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .chk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('mp')">Matière première</button>
    <button class="tab-btn" onclick="showTab('labo')">Labo</button>
    <button class="tab-btn" onclick="showTab('boulange')">Boulangerie</button>
    <button class="tab-btn" onclick="showTab('patis')">Pâtisserie</button>
    <button class="tab-btn" onclick="showTab('historique')">Historique</button>
</div>

<div class="container">
    <!-- ONGLET MP -->
    <div id="tab-mp" class="tab-content active">
        <div class="section-box" style="background: #fff3e0;">
            <strong>☁️ Statut Cloud :</strong> <span id="cloud-status">Prêt</span> | 
            <button class="btn" style="background:var(--primary); margin-left:10px;" onclick="syncGist()">🔄 Synchroniser avec GitHub Gist</button>
            <button class="btn" style="background:#7f8c8d; margin-left:5px;" onclick="resetToken()">🔑 Modifier la clé</button>
        </div>
        <table id="table-mp">
            <thead>
                <tr><th>Usage</th><th>Fournisseur</th><th>Produit</th><th>Prix HT/KG</th><th>Action</th></tr>
            </thead>
            <tbody id="body-mp"></tbody>
        </table>
        <button class="btn" style="background:var(--success)" onclick="addRowMP()">+ Ajouter MP</button>
    </div>

    <!-- ONGLET LABO -->
    <div id="tab-labo" class="tab-content">
        <div id="capture-zone" style="padding:15px; background:white;">
            <h2 style="border-bottom: 2px solid var(--primary); padding-bottom:10px;">🧪 Calculateur Labo Expert</h2>
            
            <div class="section-box">
                <h4>1. Ingrédients</h4>
                <table id="table-labo">
                    <thead>
                        <tr><th>Filtre</th><th>Produit</th><th>Qté (g)</th><th>Prix/kg</th><th>Total</th></tr>
                    </thead>
                    <tbody id="body-labo"></tbody>
                </table>
                <button class="btn" style="background:var(--success)" onclick="addRowLabo()">+ Ajouter ingrédient</button>
            </div>

            <div class="calc-grid">
                <div class="section-box">
                    <h4>2. Frais & Rendement</h4>
                    <label>Poids pièce crue (g) :</label>
                    <input type="number" id="labo-poids-piece" value="0" oninput="calculerLabo()">
                    <label style="margin-top:10px; display:block;">Coût Emballage unité (€) :</label>
                    <input type="number" id="labo-emb" value="0" step="0.01" oninput="calculerLabo()">
                    <label style="margin-top:10px; display:block;">Autres frais (€) :</label>
                    <input type="number" id="labo-frais" value="0" step="0.01" oninput="calculerLabo()">
                </div>

                <div class="section-box">
                    <h4>3. Calcul de Marge</h4>
                    <label>Méthode :</label>
                    <select id="labo-methode" onchange="calculerLabo()">
                        <option value="coef">Coefficient Multiplicateur</option>
                        <option value="marge">Taux de Marge (%)</option>
                    </select>
                    <label style="margin-top:10px; display:block;">Valeur (Coef ou %) :</label>
                    <input type="number" id="val-coef" value="3.5" step="0.1" oninput="calculerLabo()">
                    <label style="margin-top:10px; display:block;">TVA (%) :</label>
                    <select id="labo-tva" onchange="calculerLabo()">
                        <option value="5.5">5.5%</option>
                        <option value="10">10%</option>
                        <option value="20">20%</option>
                    </select>
                </div>

                <div class="result-card">
                    <h4>PRIX DE VENTE TTC</h4>
                    <div style="font-size:2.5em; font-weight:bold;"><span id="res-ttc">0.00</span> €</div>
                    <hr style="opacity:0.3">
                    <p>Prix de revient : <span id="res-revient">0.00</span> €</p>
                    <p>Marge brute : <span id="res-marge-brute">0.00</span> €</p>
                </div>
            </div>
        </div>

        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn" style="background:#e67e22" onclick="saveAsJPG()">📸 Sauvegarder Image (JPG)</button>
            <button class="btn" style="background:#8e44ad" onclick="alert('Fiche archivée !')">📂 Archiver la fiche</button>
        </div>
    </div>
</div>

<script>
    // Configuration GitHub Gist (Clé gérée par popup)
    const GIST_ID = "99caadd65ae7d235bb34c56975410acd";
    let cachedToken = localStorage.getItem('gh_token') || "";

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function resetToken() {
        cachedToken = prompt("Veuillez saisir votre Token GitHub (ghp_...) :");
        if(cachedToken) localStorage.setItem('gh_token', cachedToken);
    }

    // --- MATIÈRES PREMIÈRES ---
    function addRowMP(data = {}) {
        const row = document.getElementById('body-mp').insertRow();
        row.innerHTML = `
            <td><div class="chk-grid">
                <label><input type="checkbox" class="m-b" ${data.b?'checked':''}> B</label>
                <label><input type="checkbox" class="m-p" ${data.p?'checked':''}> P</label>
                <label><input type="checkbox" class="m-v" ${data.v?'checked':''}> V</label>
                <label><input type="checkbox" class="m-g" ${data.g?'checked':''}> G</label>
            </div></td>
            <td><input type="text" class="mp-fourn" value="${data.f || ''}"></td>
            <td><input type="text" class="mp-nom" value="${data.n || ''}"></td>
            <td><input type="number" class="mp-prix" value="${data.px || ''}"></td>
            <td><button onclick="this.parentElement.parentElement.remove()" style="background:red; color:white; border:none; border-radius:4px; cursor:pointer;">X</button></td>`;
    }

    // --- LABO ---
    function addRowLabo() {
        const row = document.getElementById('body-labo').insertRow();
        row.innerHTML = `
            <td><select onchange="filterIng(this)" style="width:70px;"><option value="ALL">Tous</option><option value="B">B</option><option value="P">P</option><option value="V">V</option><option value="G">G</option></select></td>
            <td><select class="sel-prod" onchange="updatePrice(this)"></select></td>
            <td><input type="number" class="l-qte" value="0" oninput="calculerLabo()"></td>
            <td class="l-u-prix">0.00</td>
            <td class="l-total">0.00</td>`;
        filterIng(row.cells[0].querySelector('select'));
    }

    function filterIng(sel) {
        const target = sel.parentElement.parentElement.querySelector('.sel-prod');
        const metier = sel.value;
        let opt = '<option value="0">---</option>';
        document.querySelectorAll('#body-mp tr').forEach(tr => {
            const nom = tr.querySelector('.mp-nom').value;
            const prix = tr.querySelector('.mp-prix').value;
            const match = (metier==='ALL') || (metier==='B' && tr.querySelector('.m-b').checked) || (metier==='P' && tr.querySelector('.m-p').checked) || (metier==='V' && tr.querySelector('.m-v').checked) || (metier==='G' && tr.querySelector('.m-g').checked);
            if(nom && match) opt += `<option value="${prix}">${nom}</option>`;
        });
        target.innerHTML = opt;
    }

    function updatePrice(sel) {
        sel.parentElement.parentElement.querySelector('.l-u-prix').innerText = sel.value;
        calculerLabo();
    }

    function calculerLabo() {
        let totalCout = 0, totalPoids = 0;
        document.querySelectorAll('#body-labo tr').forEach(tr => {
            const q = parseFloat(tr.querySelector('.l-qte').value) || 0;
            const p = parseFloat(tr.querySelector('.sel-prod').value) || 0;
            const res = (q/1000)*p;
            tr.querySelector('.l-total').innerText = res.toFixed(2);
            totalCout += res; totalPoids += q;
        });

        const pPiece = parseFloat(document.getElementById('labo-poids-piece').value) || 0;
        const emb = parseFloat(document.getElementById('labo-emb').value) || 0;
        const frais = parseFloat(document.getElementById('labo-frais').value) || 0;
        const tva = 1 + (parseFloat(document.getElementById('labo-tva').value)/100);
        const methode = document.getElementById('labo-methode').value;
        const valMet = parseFloat(document.getElementById('val-coef').value) || 1;

        if(totalPoids > 0 && pPiece > 0) {
            const coutMatPiece = (totalCout / totalPoids) * pPiece;
            const revientPiece = coutMatPiece + emb + frais;
            let pvHT = (methode === 'coef') ? (revientPiece * valMet) : (revientPiece / (1 - (valMet/100)));

            document.getElementById('res-revient').innerText = revientPiece.toFixed(2);
            document.getElementById('res-ttc').innerText = (pvHT * tva).toFixed(2);
            document.getElementById('res-marge-brute').innerText = (pvHT - revientPiece).toFixed(2);
        }
    }

    // --- CLOUD GIST ---
    async function syncGist() {
        if(!cachedToken) {
            resetToken();
            if(!cachedToken) return;
        }

        document.getElementById('cloud-status').innerText = "⏳ Envoi...";
        const data = Array.from(document.querySelectorAll('#body-mp tr')).map(tr => ({
            b: tr.querySelector('.m-b').checked, p: tr.querySelector('.m-p').checked,
            v: tr.querySelector('.m-v').checked, g: tr.querySelector('.m-g').checked,
            f: tr.querySelector('.mp-fourn').value, n: tr.querySelector('.mp-nom').value,
            px: tr.querySelector('.mp-prix').value
        }));

        try {
            const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                method: "PATCH",
                headers: { "Authorization": `token ${cachedToken}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    files: { "ingredients.json": { content: JSON.stringify(data, null, 2) } }
                })
            });
            if(response.ok) {
                document.getElementById('cloud-status').innerText = "✅ Synchronisé !";
            } else {
                if(response.status === 401) {
                    alert("Token invalide ou expiré.");
                    localStorage.removeItem('gh_token');
                } else {
                    alert("Erreur GitHub : " + response.status);
                }
                document.getElementById('cloud-status').innerText = "❌ Erreur";
            }
        } catch(e) { alert("Erreur réseau"); }
    }

    function saveAsJPG() {
        html2canvas(document.querySelector("#capture-zone")).then(canvas => {
            const a = document.createElement('a');
            a.download = "Fiche_Labo.jpg";
            a.href = canvas.toDataURL("image/jpeg");
            a.click();
        });
    }
</script>
</body>
</html>
