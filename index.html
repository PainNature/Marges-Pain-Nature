<script>
const GIST_ID = "99caadd65ae7d235bb34c56975410acd";
const GIST_FILENAME = "ingredients_boulangerie.json";
const SYNC_INTERVAL = 5000; // vérification toutes les 5s
let priceHistory = JSON.parse(localStorage.getItem('price_hist_v30')) || [];
let lastSyncHash = null;
let isSyncing = false;
let GITHUB_TOKEN = null;

// === ⚙️ INIT GLOBALE ===
window.onload = async () => {
    // Chargement initial local
    const savedMP = localStorage.getItem('mp_data_v30');
    if(savedMP && JSON.parse(savedMP).length > 0) {
        JSON.parse(savedMP).forEach(d => addRowMP(d));
    } else console.log("Catalogue local vide. Prêt pour sync Cloud.");

    await initToken();
    initRealtimeSync();
};

// === 🎟️ TOKEN MANAGEMENT (stocké une seule fois par appareil) ===
async function initToken() {
    GITHUB_TOKEN = localStorage.getItem('gh_token');
    const tokenInput = document.getElementById('gh-token');

    if (GITHUB_TOKEN) {
        tokenInput.value = GITHUB_TOKEN;
        return;
    }

    const input = prompt("Entrez votre token GitHub (sera gardé de manière sécurisée sur cet appareil):");
    if (input && input.trim() !== '') {
        GITHUB_TOKEN = input.trim();
        localStorage.setItem('gh_token', GITHUB_TOKEN);
        tokenInput.value = GITHUB_TOKEN;
        alert("✅ Token enregistré localement.");
    } else {
        alert("⛔ Aucun token fourni, la synchronisation cloud restera désactivée.");
    }
}

// === 📦 OUTILS DE SAUVEGARDE LOCALE ===
function saveMPToLocal() {
    const data = Array.from(document.querySelectorAll('#body-mp tr')).map(tr => ({
        m: Array.from(tr.querySelectorAll('.m-badge.selected')).map(b => b.innerText),
        f: tr.querySelector('.f').value,
        n: tr.querySelector('.n').value,
        px: tr.querySelector('.p').value,
        updatedAt: new Date().toISOString()
    }));
    localStorage.setItem('mp_data_v30', JSON.stringify(data));
}

function renderFromData(data) {
    document.getElementById('body-mp').innerHTML = "";
    data.forEach(d => addRowMP(d));
    filterMP();
}

// === 🔁 SYNC GIST AUTOMATIQUE ===
function generateHash(data) {
    return JSON.stringify(data).split('').reduce((a, b) => ((a << 5) - a) + b.charCodeAt(0), 0).toString();
}

async function fetchFromGist() {
    try {
        const res = await fetch(`[api.github.com](https://api.github.com/gists/${GIST_ID})`, {
            headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });
        if(!res.ok) throw new Error(res.statusText);
        const gist = await res.json();
        const content = gist.files[GIST_FILENAME]?.content;
        return content ? JSON.parse(content) : [];
    } catch(e) {
        console.error("Erreur fetch:", e);
        return [];
    }
}

async function saveToGist(data) {
    try {
        const res = await fetch(`[api.github.com](https://api.github.com/gists/${GIST_ID})`, {
            method: "PATCH",
            headers: { 
                "Authorization": `token ${GITHUB_TOKEN}`, 
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } }
            })
        });
        if (!res.ok) throw new Error("Erreur de sauvegarde");
        lastSyncHash = generateHash(data);
        console.log("✅ Sauvegarde cloud réussie");
    } catch(e) { console.error("Erreur save:", e); }
}

function mergeData(local, remote) {
    const merged = new Map();
    remote.forEach(i => merged.set(i.n+i.f, i));
    local.forEach(i => {
        const existing = merged.get(i.n+i.f);
        if(!existing || (i.updatedAt > existing.updatedAt)) merged.set(i.n+i.f, i);
    });
    return Array.from(merged.values());
}

// === 🔄 SUIVI TEMPS RÉEL VIA POLLING ===
async function checkForUpdates() {
    if (!GITHUB_TOKEN || isSyncing) return;
    isSyncing = true;

    const remote = await fetchFromGist();
    const local = JSON.parse(localStorage.getItem('mp_data_v30') || "[]");
    const remoteHash = generateHash(remote);
    const localHash = generateHash(local);

    if (remoteHash !== lastSyncHash && remoteHash !== localHash) {
        const merged = mergeData(local, remote);
        localStorage.setItem('mp_data_v30', JSON.stringify(merged));
        renderFromData(merged);
        lastSyncHash = generateHash(merged);
        console.log("🔄 Données Cloud mises à jour (fusion)");
    }

    isSyncing = false;
}

function initRealtimeSync() {
    // Chargement initial depuis le cloud
    fetchFromGist().then(remote => {
        if (remote.length > 0) {
            const local = JSON.parse(localStorage.getItem('mp_data_v30') || "[]");
            const merged = mergeData(local, remote);
            renderFromData(merged);
            localStorage.setItem('mp_data_v30', JSON.stringify(merged));
            lastSyncHash = generateHash(merged);
            console.log("☁️ Catalogue synchronisé initialement");
        }
    });

    // Vérification automatique
    setInterval(checkForUpdates, SYNC_INTERVAL);

    // Surveillance de changements locaux
    const observer = new MutationObserver(async () => {
        const local = JSON.parse(localStorage.getItem('mp_data_v30') || "[]");
        const hash = generateHash(local);
        if (hash !== lastSyncHash) {
            await saveToGist(local);
        }
    });
    observer.observe(document.getElementById('body-mp'), { childList: true, subtree: true });
}

// === 🌀 SYNC MANUEL OPTIONNEL ===
async function syncGist() {
    if (!GITHUB_TOKEN) await initToken();
    const remote = await fetchFromGist();
    if (remote.length > 0 && confirm("Remplacer le catalogue local par la version Cloud ?")) {
        renderFromData(remote);
        localStorage.setItem('mp_data_v30', JSON.stringify(remote));
        lastSyncHash = generateHash(remote);
        alert("✅ Catalogue restauré depuis le Cloud");
    } else {
        await saveToGist(JSON.parse(localStorage.getItem('mp_data_v30') || "[]"));
        alert("✅ Catalogue local envoyé vers le Cloud");
    }
}
</script>
