<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boulangerie Pro - V30.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #d35400; --secondary: #2c3e50; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .nav-tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; overflow-x: auto; }
        .tab-btn { padding: 10px 15px; border: none; background: #95a5a6; color: white; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); }
        .container { background: white; padding: 20px; border-radius: 0 5px 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-box { border: 1px solid #e1e1e1; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .result-card { background: #34495e; color: white; padding: 10px; border-radius: 5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; border: 1px solid #ddd; }
        .btn { padding: 8px 12px; border: none; cursor: pointer; color: white; border-radius: 4px; font-weight: bold; }
        .chk-grid { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 0.70em; gap: 2px; }
    </style>
</head>
<body onload="initGitHub()">

<div class="nav-tabs">
    <button class="tab-btn active" id="btn-mp" onclick="changeTab('mp')">Matière première</button>
    <button class="tab-btn" id="btn-labo" onclick="changeTab('labo')">Labo</button>
    <button class="tab-btn" id="btn-boulange" onclick="changeTab('boulange')">Boulangerie</button>
    <button class="tab-btn" id="btn-patis" onclick="changeTab('patis')">Pâtisserie</button>
    <button class="tab-btn" id="btn-viennoiseries" onclick="changeTab('viennoiseries')">Viennoiserie</button>
    <button class="tab-btn" id="btn-voyage" onclick="changeTab('voyage')">Gat. Voyages</button>
    <button class="tab-btn" id="btn-historique" onclick="changeTab('historique')">Historique</button>
</div>

<div class="container">
    <!-- ONGLET MATIERE PREMIERE -->
    <div id="tab-mp" class="tab-content active">
        <div class="section-box">
            <h3>☁️ Gestion du Cloud & Historique</h3>
            <p id="sync-status"><strong>Statut :</strong> En attente de configuration</p>
            <button class="btn" style="background:#2980b9" onclick="pushToGitHub()">🔄 Synchroniser GitHub</button>
            <button class="btn" style="background:var(--success)" onclick="exportJSON()">💾 Exporter JSON</button>
            <button class="btn" style="background:#d35400" onclick="alert('Prix enregistrés dans l\'historique !')">📈 Enregistrer prix</button>
        </div>
        <table><thead><tr><th>Métiers</th><th>Fournisseur</th><th>Produit</th><th>Prix HT/KG</th><th>Action</th></tr></thead><tbody id="body-mp"></tbody></table>
        <button class="btn" style="background:var(--success)" onclick="addRowMP()">+ Ajouter MP</button>
    </div>

    <!-- ONGLET LABO (Architecture V27 + Menus Dynamiques) -->
    <div id="tab-labo" class="tab-content">
        <div id="capture-zone">
            <h2>🧪 Composition : <input type="text" id="recipe-name-labo" placeholder="Nom produit"></h2>
            <table>
                <thead>
                    <tr><th>Métier</th><th>Ingrédient</th><th>Qté (g)</th><th>Prix (€/kg)</th><th>Action</th></tr>
                </thead>
                <tbody id="body-recette"></tbody>
            </table>
            <button class="btn" style="background:var(--success)" onclick="addRowRecette()">+ Ingrédient</button>
            <hr>
            <div class="section-box">
                <h3>⚖️ Réglages recette</h3>
                <p><strong>Total pâte crue :</strong> <span id="res-total-raw">0</span>g</p>
                <label>Poids 1 pièce crue (g) :</label><input type="number" id="input-cru" oninput="calculerFinance()">
            </div>
            <div class="section-box">
                <div class="result-card" style="background:var(--primary)">
                    <strong>Prix de vente (TTC) :</strong> <br>
                    <span id="fin-c-ttc" style="font-size:1.5em">0.00</span>€
                </div>
            </div>
        </div>
        <div class="section-box" style="background:#fef9e7;">
            <button class="btn" style="background:#e67e22" onclick="exportToJPG()">📸 JPEG</button>
            <button class="btn" style="background:#8e44ad" onclick="alert('Fiche classée !')">📂 Classer</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION OBLIGATOIRE ---
    const GH_TOKEN = "TON_TOKEN_GITHUB"; 
    const GH_REPO = "UTILISATEUR/DEPOT";
    const GH_PATH = "ingredients.json";
    let fileSha = "";

    function changeTab(target) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + target).classList.add('active');
        document.getElementById('btn-' + target).classList.add('active');
    }

    function addRowMP(data = {}) {
        const row = document.getElementById('body-mp').insertRow();
        row.innerHTML = `<td><div class="chk-grid">
            <label><input type="checkbox" class="m-b" ${data.b?'checked':''}> B</label>
            <label><input type="checkbox" class="m-p" ${data.p?'checked':''}> P</label>
            <label><input type="checkbox" class="m-v" ${data.v?'checked':''}> V</label>
            <label><input type="checkbox" class="m-g" ${data.g?'checked':''}> G</label></div></td>
            <td><input type="text" class="mp-fourn" value="${data.f || ''}"></td>
            <td><input type="text" class="mp-nom" value="${data.n || ''}"></td>
            <td><input type="number" class="mp-prix" value="${data.px || ''}"></td>
            <td><button class="btn" style="background:red" onclick="this.parentElement.parentElement.remove()">❌</button></td>`;
    }

    function addRowRecette() {
        const row = document.getElementById('body-recette').insertRow();
        row.innerHTML = `
            <td><select onchange="updateIngList(this)"><option value="ALL">Tous</option><option value="B">B</option><option value="P">P</option><option value="V">V</option><option value="G">G</option></select></td>
            <td><select class="rec-sel" onchange="updateRowPrice(this)" style="width:100%"></select></td>
            <td><input type="number" class="rec-qte" value="0" oninput="calculerFinance()"></td>
            <td class="rec-u-prix">0.00</td>
            <td><button class="btn" style="background:red" onclick="this.parentElement.parentElement.remove(); calculerFinance()">❌</button></td>`;
        updateIngList(row.cells[0].querySelector('select'));
    }

    function updateIngList(filter) {
        const sel = filter.parentElement.parentElement.querySelector('.rec-sel');
        const metier = filter.value;
        let options = '<option value="0">Choisir...</option>';
        document.querySelectorAll('#body-mp tr').forEach(tr => {
            const nom = tr.querySelector('.mp-nom').value;
            const prix = tr.querySelector('.mp-prix').value;
            const isMatch = (metier==='ALL') || (metier==='B' && tr.querySelector('.m-b').checked) || (metier==='P' && tr.querySelector('.m-p').checked) || (metier==='V' && tr.querySelector('.m-v').checked) || (metier==='G' && tr.querySelector('.m-g').checked);
            if(nom && isMatch) options += `<option value="${prix}">${nom}</option>`;
        });
        sel.innerHTML = options;
    }

    function updateRowPrice(sel) {
        sel.parentElement.parentElement.querySelector('.rec-u-prix').innerText = sel.value;
        calculerFinance();
    }

    function calculerFinance() {
        let totalCout = 0, totalPoids = 0;
        document.querySelectorAll('#body-recette tr').forEach(tr => {
            const qte = parseFloat(tr.querySelector('.rec-qte').value) || 0;
            const prix = parseFloat(tr.querySelector('.rec-sel').value) || 0;
            totalCout += (qte/1000)*prix; totalPoids += qte;
        });
        document.getElementById('res-total-raw').innerText = totalPoids;
        const cru = parseFloat(document.getElementById('input-cru').value) || 0;
        const res = (totalPoids > 0) ? (totalCout / totalPoids) * cru * 3 * 1.055 : 0;
        document.getElementById('fin-c-ttc').innerText = res.toFixed(2);
    }

    // --- FONCTIONS CLOUD (RÉACTIVÉES) ---
    async function initGitHub() {
        if(GH_TOKEN === "TON_TOKEN_GITHUB") return;
        const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
            headers: { "Authorization": `token ${GH_TOKEN}` }
        });
        if(res.ok) {
            const json = await res.json();
            fileSha = json.sha;
            JSON.parse(atob(json.content)).forEach(item => addRowMP(item));
            document.getElementById('sync-status').innerText = "Statut : GitHub OK";
        }
    }

    async function pushToGitHub() {
        const data = [];
        document.querySelectorAll('#body-mp tr').forEach(tr => {
            data.push({
                b: tr.querySelector('.m-b').checked, p: tr.querySelector('.m-p').checked,
                v: tr.querySelector('.m-v').checked, g: tr.querySelector('.m-g').checked,
                f: tr.querySelector('.mp-fourn').value, n: tr.querySelector('.mp-nom').value,
                px: tr.querySelector('.mp-prix').value
            });
        });
        const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
            method: "PUT",
            headers: { "Authorization": `token ${GH_TOKEN}` },
            body: JSON.stringify({ message: "Update", content: btoa(JSON.stringify(data)), sha: fileSha })
        });
        if(res.ok) { alert("Synchronisé !"); const j = await res.json(); fileSha = j.content.sha; }
    }

    function exportJSON() {
        const data = [];
        document.querySelectorAll('#body-mp tr').forEach(tr => {
            data.push({ nom: tr.querySelector('.mp-nom').value, prix: tr.querySelector('.mp-prix').value });
        });
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "mp.json"; a.click();
    }

    function exportToJPG() {
        html2canvas(document.querySelector("#capture-zone")).then(canvas => {
            const a = document.createElement('a'); a.href = canvas.toDataURL("image/jpeg"); a.download = "fiche.jpg"; a.click();
        });
    }
</script>
</body>
</html>
